<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z SHOP Myanmar | POS & Inventory Management</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Z SHOP Myanmar | POS & Inventory Management" />
    <meta name="description" content="Manage your shop efficiently with Z SHOP POS. Track inventory, sales, and expenses in real-time." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zshopmm.shop/" />
    <meta property="og:title" content="Z SHOP Myanmar | POS & Inventory Management" />
    <meta property="og:description" content="Manage your shop efficiently with Z SHOP POS. Track inventory, sales, and expenses in real-time." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://zshopmm.shop/" />
    <meta property="twitter:title" content="Z SHOP Myanmar | POS & Inventory Management" />
    <meta property="twitter:description" content="Manage your shop efficiently with Z SHOP POS. Track inventory, sales, and expenses in real-time." />
    <meta property="twitter:image" content="/favicon.svg" />

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            }, err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="loading-fallback" style="padding: 20px; font-family: sans-serif; text-align: center; color: #475569;">
        <div style="margin-bottom: 20px; font-weight: bold;">Initializing Z SHOP POS...</div>
        <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        <div style="margin-top: 20px; font-size: 12px; color: #94a3b8;">If this screen stays for more than 10 seconds, please refresh.</div>
      </div>
    </div>
    <div id="error-display" style="display: none; position: fixed; top: 0; left: 0; width: 100%; padding: 20px; background: #fee2e2; color: #b91c1c; font-family: monospace; z-index: 9999; font-size: 14px; border-bottom: 2px solid #ef4444; overflow-y: auto; max-height: 50vh; box-sizing: border-box;">
      <strong>JavaScript Error Detected:</strong>
      <pre id="error-message" style="margin-top: 10px; white-space: pre-wrap; word-break: break-all; font-size: 12px; border: 1px solid #fecaca; padding: 10px; background: #fff;"></pre>
      <button onclick="window.location.reload()" style="margin-top: 10px; padding: 10px 20px; background: #b91c1c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Reload & Try Again</button>
    </div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var display = document.getElementById('error-display');
        var msg = document.getElementById('error-message');
        if (display && msg) {
          display.style.display = 'block';
          msg.textContent = message + '\n\nAt: ' + source + ':' + lineno + ':' + colno + '\n\nStack Trace:\n' + (error ? error.stack : 'N/A');
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        var display = document.getElementById('error-display');
        var msg = document.getElementById('error-message');
        if (display && msg) {
          display.style.display = 'block';
          msg.textContent = 'Unhandled Promise Rejection:\n' + event.reason;
        }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
